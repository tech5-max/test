# Round-robin load balancer for the load-test topology (docker-compose.loadtest.yml).
#
# How the fan-out works: we DON'T use a static `upstream` block (open-source nginx
# can't re-resolve those as replicas come and go). Instead we proxy to the compose
# service name through Docker's embedded DNS (127.0.0.11). Docker returns every
# replica's IP and rotates the order, so each resolve round-robins across them.
# Using a variable in proxy_pass forces that per-request re-resolution.

events {
  worker_connections 4096;
}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;

  # Pass the real client IP through so each app's IP rate limiter (trust proxy is
  # set in index.ts) counts the visitor, not the LB.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_read_timeout 65s;

  # Instance-id header so load tests can confirm traffic really spread across
  # replicas: the upstream address differs per replica.
  add_header X-Upstream $upstream_addr always;

  # fast-dragon
  server {
    listen 8080;
    location / {
      set $fd http://fast-dragon:5555;
      proxy_pass $fd;
    }
  }

  # express-guardian
  server {
    listen 8081;
    location / {
      set $eg http://express-guardian:5001;
      proxy_pass $eg;
    }
  }
}
